---
name: Build Lyrical / Jetty Docker image (AMD64)

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: [ros2]
  push:
    tags: ["*"]
    branches: [ros2, dockertest]

env:
  IMAGE_NAME: ioeslab/dave
  ROS_DISTRO: lyrical

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-to-docker-hub:
    # Validate all PRs on disposable hosted runners, including fork PRs.
    # Keep publishing builds on the existing self-hosted runner.
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request'
          && '["ubuntu-26.04"]' || '["self-hosted", "x64"]') }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 360 || 1440 }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          outputs: >-
            ${{ github.event_name == 'pull_request'
                && format('type=oci,dest={0}/pr-image.tar', runner.temp) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: .docker/lyrical.amd64.dockerfile
          platforms: linux/amd64
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}

      - name: Upload PR image for trusted publishing
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dave-pr-image-amd64
          path: ${{ runner.temp }}/pr-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
