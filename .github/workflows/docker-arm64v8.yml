---
name: Build Lyrical / Jetty Docker image (ARM64)

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: [ros2]
    paths:
      - ".docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-arm64v8.yml"
      - "dave_interfaces/**"
      - "examples/**"
      - "extras/**"
      - "gazebo/**"
      - "models/**"
      - "README.md"
  push:
    tags: ["*"]
    branches: [ros2, dockertest]

env:
  IMAGE_NAME: ioeslab/dave
  ROS_DISTRO: lyrical

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-to-docker-hub:
    # Never execute untrusted fork code on a self-hosted runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 1440
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # On a macOS launchd runner, the docker-container driver can try to
          # open Docker Desktop's interactive Keychain credential helper.
          # The native driver avoids that dependency for this single-platform
          # ARM64 build and works with Docker Desktop's containerd image store.
          driver: docker

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ros2-arm-rdp,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: .docker/lyrical.arm64v8.dockerfile
          platforms: linux/arm64/v8
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
