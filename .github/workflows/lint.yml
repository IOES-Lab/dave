---
name: Code Formatting Lint

# yamllint disable-line rule:truthy
on:
  push:
    tags: ["*"]
    branches:
      - ros2
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  #   ament_lint:
  #     runs-on: ubuntu-latest
  #     container:
  #       image: rostooling/setup-ros-docker:ubuntu-resolute-ros-lyrical-desktop-latest
  #       options: -u root
  #     strategy:
  #       fail-fast: false
  #       matrix:
  #         linter: [flake8, mypy, pep8, xmllint]
  #     steps:
  #       - uses: actions/checkout@v2
  #       - uses: ros-tooling/action-ros-lint@master
  #         with:
  #           linter: ${{ matrix.linter }}
  #           package-name: .

  run-linters:
    name: Run Linters for Code Format Check
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v1
        with:
          python-version: 3.12

      - name: Install Python dependencies
        run: pip install black flake8 cmakelang

      - name: Install system lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run Linters for python and C++
        uses: wearerequired/lint-action@v2
        with:
          black: true
          black_args: --line-length 100
          flake8: true
          flake8_args: --max-line-length=100
          clang_format: true

      - name: Run XML Linter for URDF, SDF, Xacro, XML files
        run: |
          python - <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_extensions = {".urdf", ".sdf", ".xacro", ".xml", ".launch", ".world"}
          tag_pattern = re.compile(rb"<[^!?][^>]*>")
          element_prefix_pattern = re.compile(rb"</?([A-Za-z_][\w.-]*):[A-Za-z_][\w.-]*(?=[\s>/])")
          attribute_prefix_pattern = re.compile(rb"\s([A-Za-z_][\w.-]*):[A-Za-z_][\w.-]*(?=\s*=)")
          namespace_pattern = re.compile(rb"\bxmlns:([A-Za-z_][\w.-]*)=")
          root_tag_pattern = re.compile(
              rb"<([A-Za-z_][\w.-]*)(?:\"[^\"]*\"|'[^']*'|[^'\">])*>"
          )
          files = sorted(
              path for path in Path(".").rglob("*")
              if path.is_file() and path.suffix.lower() in xml_extensions
          )
          failures = []

          for path in files:
              xml_bytes = path.read_bytes()
              tags = b" ".join(tag_pattern.findall(xml_bytes))
              missing_prefixes = sorted(
                  (
                      set(element_prefix_pattern.findall(tags))
                      | set(attribute_prefix_pattern.findall(tags))
                  ) - set(namespace_pattern.findall(tags))
              )
              if missing_prefixes:
                  root_match = root_tag_pattern.search(xml_bytes)
                  if root_match:
                      insertion = b"".join(
                          b' xmlns:' + prefix + b'="urn:ci:' + prefix + b'"'
                          for prefix in missing_prefixes
                      )
                      insert_at = root_match.end() - 1
                      xml_bytes = (
                          xml_bytes[:insert_at] + insertion + xml_bytes[insert_at:]
                      )

              try:
                  ET.fromstring(xml_bytes)
              except ET.ParseError as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("XML validation failed for the following files:", file=sys.stderr)
              for failure in failures:
                  print(failure, file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(files)} XML files")
          PY

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master

      - name: Run Yamllint on YAML and .launch files
        run: |
            find . \( -iname '*.yml' -o -iname '*.yaml' \) -print0 | xargs -0 yamllint -d "{
                extends: default,
                rules: {
                    line-length: {max: 120},
                    new-line-at-end-of-file: disable
                }
            }"

      - name: Lint CMake files
        run: find . \( -iname 'CMakeLists.txt' -o -iname '*.cmake' \) -print0 | xargs -0 cmake-lint
