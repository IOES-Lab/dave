---
name: Build and deploy Pages

# After merging, select Settings > Pages > Source > GitHub Actions to retire
# GitHub's generated legacy workflow and its uneditable action versions.
# yamllint disable-line rule:truthy
on:
  push:
    branches: [ros2]
  pull_request:
    branches: [ros2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Build the existing Jekyll site from the repository root
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ros2'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
